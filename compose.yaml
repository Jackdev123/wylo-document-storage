services:
  wds:
    build:
      context: .
    image: wylo-document-storage:local
    container_name: wds
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WDS_PORT:-4173}:4173"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
